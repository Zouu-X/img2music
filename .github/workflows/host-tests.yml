name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
      - name: Run music and button tests with sanitizers
        env:
          CXX: clang++
        run: sh tools/test.sh
      - name: Test device profiles offline
        run: python3 -m unittest discover -s tests -p 'test_device_profile.py'
